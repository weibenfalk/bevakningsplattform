# Lokal PostgreSQL. Port 5433 för att inte krocka med en eventuell lokal Postgres på 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bevakning
      POSTGRES_PASSWORD: bevakning
      POSTGRES_DB: bevakning
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevakning"]
      interval: 2s
      timeout: 3s
      retries: 15
